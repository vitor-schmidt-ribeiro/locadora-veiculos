  <rect x="760" y="125" width="180" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="775" y="149" fill="#94a3b8" font-family="sans-serif" font-size="12">Todas as Categorias</text>
  
  <rect x="955" y="125" width="80" height="38" rx="6" fill="#334155"/>
  <text x="975" y="149" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Filtrar</text>
  
  <rect x="1080" y="125" width="140" height="38" rx="6" fill="#2563eb"/>
  <text x="1105" y="149" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">+ Novo Veículo</text>
  
  <!-- Table Header -->
  <rect x="310" y="185" width="910" height="40" fill="#f1f5f9"/>
  <text x="330" y="210" fill="#475569" font-family="sans-serif" font-size="12" font-weight="bold">PLACA</text>
  <text x="430" y="210" fill="#475569" font-family="sans-serif" font-size="12" font-weight="bold">MODELO</text>
  <text x="600" y="210" fill="#475569" font-family="sans-serif" font-size="12" font-weight="bold">FABRICANTE</text>
  <text x="740" y="210" fill="#475569" font-family="sans-serif" font-size="12" font-weight="bold">CATEGORIA</text>
  <text x="890" y="210" fill="#475569" font-family="sans-serif" font-size="12" font-weight="bold">STATUS</text>
  <text x="1090" y="210" fill="#475569" font-family="sans-serif" font-size="12" font-weight="bold">AÇÕES</text>
  
  <!-- Table Row -->
  <rect x="310" y="235" width="910" height="50" fill="#ffffff" stroke="#f1f5f9"/>
  <text x="330" y="265" fill="#1e293b" font-family="sans-serif" font-size="12">BRA2E19</text>
