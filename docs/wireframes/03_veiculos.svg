  <text x="600" y="265" fill="#1e293b" font-family="sans-serif" font-size="12">Toyota</text>
  <text x="740" y="265" fill="#1e293b" font-family="sans-serif" font-size="12">Sedan Médio</text>
  <rect x="885" y="252" width="80" height="22" rx="11" fill="#dcfce7"/>
