  <rect x="280" y="100" width="970" height="660" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  
  <!-- Search Filters (2 fields) -->
  <rect x="310" y="125" width="240" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="325" y="149" fill="#94a3b8" font-family="sans-serif" font-size="12">Filtrar por Modelo...</text>
  
